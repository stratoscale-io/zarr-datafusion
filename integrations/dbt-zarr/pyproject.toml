[project]
name = "dbt-zarr"
version = "0.1.0"
description = "dbt adapter for zarr-datafusion: run dbt models directly on Zarr stores over Arrow Flight SQL"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "dbt-core>=1.10,<2",
    "dbt-adapters>=1.10,<2",
    "dbt-common>=1.10,<2",
    "adbc-driver-flightsql>=1.0",
    "pyarrow>=14",
]

[project.optional-dependencies]
test = ["dbt-tests-adapter>=1.10,<2", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `dbt`, `dbt.adapters` and `dbt.include` are namespace packages shared with
# dbt-core / dbt-adapters, so ship only our subpackages, without their
# parent `__init__.py` files.
[tool.hatch.build.targets.wheel]
only-include = ["dbt/adapters/zarr", "dbt/include/zarr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
